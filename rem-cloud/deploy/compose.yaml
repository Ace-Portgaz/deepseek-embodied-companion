services:
  rem:
    build:
      context: ../build
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    stdin_open: true
    environment:
      TZ: Asia/Shanghai
    secrets:
      - rem_settings
      - rem_credentials
    volumes:
      - rem_data:/opt/xiaozhi-esp32-server/data
    tmpfs:
      - /opt/xiaozhi-esp32-server/tmp:uid=10001,gid=10001,mode=0700,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging:
      driver: local
      options:
        max-size: 2m
        max-file: "2"
  edge:
    image: caddy:2
    restart: unless-stopped
    depends_on: [rem]
    env_file: ../runtime/caddy.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: local
      options:
        max-size: 2m
        max-file: "2"
secrets:
  rem_settings:
    file: ../runtime/settings.json
  rem_credentials:
    file: ../runtime/credentials.json
volumes:
  rem_data:
  caddy_data:
  caddy_config:
